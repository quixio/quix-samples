name: Simulink Wheel
language: python
variables:
  - name: input
    inputType: InputTopic
    multiline: false
    description: Name of the input topic to listen to.
    defaultValue: 2d-vector
  - name: output
    inputType: OutputTopic
    multiline: false
    description: Name of the output topic to write to.
    defaultValue: simulink-output
  - name: CONSUMER_GROUP
    inputType: FreeText
    multiline: false
    description: Name of the Kafka consumer group.
    defaultValue: simulink-wheel-transformation
  - name: AGREE_TO_MATLAB_RUNTIME_LICENSE
    inputType: FreeText
    multiline: false
    description: Set to yes to accept the MathWorks MATLAB Runtime license. By setting it, you, the deployer, accept that license (https://www.mathworks.com/help/compiler/get-matlab-runtime-container.html).
    required: true
dockerfile: dockerfile
runEntryPoint: main.py
defaultFile: main.py
